[project]
name = "analyse-moi-ca-back"
version = "0.1.0"
description = "API backend — Analyse-moi ça"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.122.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "google-cloud-storage>=3.13.1",
    "google-cloud-tasks>=2.24.0",
    "pillow>=10.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (imports triés)
    "UP",  # pyupgrade (syntaxe moderne)
    "B",   # flake8-bugbear (bugs fréquents)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # règles spécifiques à ruff
]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` en valeur par défaut est le patron FastAPI standard (C5) :
# l'appel est réévalué à chaque requête par le framework lui-même, pas une
# valeur mutable partagée entre requêtes comme B008 le suppose par défaut.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# `src` en layout plat (agents.md §4 : pas de `src/analyse_moi_ca/`
# intermédiaire) : pytest doit ajouter `src/` au path pour résoudre les
# imports `modules.auth...` comme le fait déjà mypy via `mypy_path`. `.`
# (racine `back/`) est nécessaire en plus pour que les imports inter-tests
# du type `from tests.modules.auth.conftest import ...` (C5, réutilisation
# du faux dépôt entre tests d'application et d'API — agents.md §1, DRY)
# résolvent quel que soit l'invocateur (`pytest` seul, sans dépendre de
# l'insertion implicite du cwd que fait uniquement `python -m pytest`).
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
# Non inclus par défaut dans --strict : signale le code mort après un `return`/`raise`.
warn_unreachable = true

# `google-cloud-storage` (E5, backlog.md) ne ship aucun marqueur `py.typed`
# ni stubs officiels, contrairement à `google-cloud-tasks` (F1, backlog.md)
# qui en fournit pour `tasks_v2` — seuls modules tiers du projet dans ce cas
# (`anthropic` en fournit). Sans `follow_imports = "skip"`, mypy traite
# `google.cloud` comme un paquet partiellement typé dès que l'un de ses
# sous-modules (`tasks_v2`) est typé, et se met à réclamer un typage complet
# du reste (`storage`) — `skip` neutralise tout le namespace `google.cloud.*`
# de façon uniforme, pas globalement au projet, pour ne pas perdre le typage
# strict sur le reste.
[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true
follow_imports = "skip"

# `google.oauth2.id_token` (F3, backlog.md) : `verify_oauth2_token` n'est
# pas annotée dans ce module (contrairement à `google.auth.transport.
# requests`/`google.auth.exceptions`, utilisées telles quelles ailleurs
# dans `api_worker.py`, déjà correctement typées) — même traitement que
# `google.cloud.*` ci-dessus, réduit au seul sous-module concerné pour ne
# pas perdre le typage strict sur le reste de `google.oauth2`/`google.auth`.
[[tool.mypy.overrides]]
module = "google.oauth2.id_token"
follow_imports = "skip"
