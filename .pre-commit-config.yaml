repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^back/
      - id: ruff-format
        files: ^back/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (back)
        entry: bash -c 'cd back && uv run mypy src'
        language: system
        files: ^back/src/.*\.py$
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: back/uv\.lock
